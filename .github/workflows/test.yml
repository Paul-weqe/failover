name: Test

on: [push, pull_request]

jobs:
  test:
    name: Runs tests on the Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: swatinem/rust-cache@v2
    
    - name: Run tests
      run: cargo test --verbose

    - name: Run clippy
      run: cargo clippy -- -D warnings

  docker:
    name: Set up docker repository
    runs-on: ubuntu-latest
    needs: test # Tests must first succeed.
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Removes the 'v' agead of version tags.
    - name: Set version tag
      id: version
      env:
        REF_NAME: ${{ github.ref_name }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: |
        if [[ "$IS_TAG" == "true" && "$REF_NAME" == v* ]]; then
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "VERSION=$REF_NAME" >> "$GITHUB_OUTPUT"
        fi


    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/paul-weqe/${{ github.event.repository.name }}:latest
          ghcr.io/paul-weqe/${{ github.event.repository.name }}:${{ github.sha }}
          ghcr.io/paul-weqe/${{ github.event.repository.name }}:${{ steps.version.outputs.VERSION }}
